<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Call center{% endblock %} | Mkulima Smart</title>
  <style>
    :root { --green: #1e5b34; --green-dark: #153f24; --line: #e3e9e0; --bg: #f5f8f3; --muted: #66756b; --ink: #173019; --danger: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header.bar { background: var(--green-dark); color: #fff; padding: .75rem 1.25rem; display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    header.bar a { color: #fff; text-decoration: none; font-weight: 700; }
    main { max-width: 1000px; margin: 0 auto; padding: 1.25rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    h2 { font-size: 1.1rem; margin: 0; }
    .muted { color: var(--muted); font-size: .92rem; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 1rem; padding: 1.1rem; margin-top: 1rem; }
    .panel-head { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-bottom: .75rem; flex-wrap: wrap; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: .75rem; padding: .7rem .85rem; border: 1px solid var(--line); border-radius: .8rem; background: #f9fbf7; margin-top: .5rem; flex-wrap: wrap; }
    .row b { display: block; }
    .row .muted { display: block; }
    .btn { display: inline-block; border: 0; border-radius: .7rem; padding: .55rem 1rem; font: inherit; font-weight: 700; cursor: pointer; background: var(--green); color: #fff; text-decoration: none; }
    .btn:hover { filter: brightness(1.1); }
    .btn.secondary { background: #eef4e6; color: var(--ink); }
    .btn.danger { background: #fdecea; color: var(--danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .pill { display: inline-block; padding: .15rem .6rem; border-radius: 999px; font-size: .8rem; font-weight: 700; background: #eef2ec; }
    .pill.on { background: #d1fae5; color: #065f46; }
    .pill.wait { background: #fef3c7; color: #92400e; }
    input[type=text], input[type=email], input[type=password], textarea { width: 100%; padding: .6rem .75rem; border: 1px solid #cdd8c9; border-radius: .6rem; font: inherit; }
    label { display: block; font-weight: 700; margin: .8rem 0 .25rem; }
    .errorlist { color: var(--danger); list-style: none; padding: 0; margin: .25rem 0 0; font-size: .9rem; }
    .flash { background: #eef4e6; border: 1px solid var(--line); padding: .6rem .9rem; border-radius: .7rem; margin-top: 1rem; }
    .empty { color: var(--muted); padding: .9rem 0; }
    code.link { word-break: break-all; font-size: .85rem; display: block; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="bar">
    <a href="{% url 'callcenter:console' %}">Mkulima Smart call center</a>
    <span>{% block bar_right %}{% endblock %}</span>
  </header>
  <main>
    {% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
